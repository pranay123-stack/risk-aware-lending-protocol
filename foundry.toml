[profile.default]
src = "contracts"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1000
bytecode_hash = "none"
fs_permissions = [
    { access = "read-write", path = "./deployments" },
    { access = "read-write", path = "./test-results" },
]
gas_reports = ["LendingPool", "OracleManager", "KinkedInterestRateModel", "LendingVault", "PoolConfigurator"]
# Gas benchmarks run only under the `gas` profile (isolated txs). A plain run would share one
# transaction's warm storage and overwrite snapshots/GasBenchmarks.json with unrealistic numbers.
no_match_path = "test/gas/*"

[fuzz]
runs = 1000
seed = "0x4c656e64"

[invariant]
runs = 256
depth = 60
fail_on_revert = true
show_metrics = true

# Gas benchmarks with per-call transaction isolation: FOUNDRY_PROFILE=gas forge test
[profile.gas]
isolate = true
match_path = "test/gas/*"
no_match_path = "test/none/*"

# Deeper campaign for CI / pre-release: FOUNDRY_PROFILE=deep forge test
[profile.deep.fuzz]
runs = 20000

[profile.deep.invariant]
runs = 1024
depth = 150

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"
number_underscore = "thousands"
sort_imports = true

[rpc_endpoints]
anvil = "http://127.0.0.1:8545"
sepolia = "${SEPOLIA_RPC_URL}"

[lint]
# Interface-mandated getter names (IInterestRateModel.baseRate(), AggregatorV3Interface.decimals()...)
# are immutables that cannot be renamed to SCREAMING_SNAKE_CASE without breaking the interface, and
# test ghost variables use the ghost_ prefix convention.
exclude_lints = [
    "screaming-snake-case-immutable",
    "screaming-snake-case-const",
    "mixed-case-variable",
    "unsafe-cheatcode",
]
# Tests cast bounded fuzz inputs and cheatcode return values; production code is linted in full.
ignore = ["test/**/*.sol"]
